# Publishes a GitHub release with a .vcvplugin for every platform, from a tag.
#
#     git tag v2.0.0 && git push origin v2.0.0
#
# The tag must match the "version" in plugin.json -- the job checks, and fails
# loudly if it does not, because a mismatched version is the single most common
# reason a VCV Library update is silently skipped.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  RACK_SDK_VERSION: 2.6.6

jobs:
  check-version:
    name: Tag matches plugin.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          manifest=$(jq -r .version plugin.json)
          tag="${GITHUB_REF_NAME#v}"
          echo "plugin.json: $manifest   tag: $tag"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin.json version $manifest."
            exit 1
          fi

  build:
    name: ${{ matrix.target }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: lin-x64,   os: ubuntu-latest }
          - { target: win-x64,   os: windows-latest }
          - { target: mac-arm64, os: macos-latest }
          - { target: mac-x64,   os: macos-latest, cross: x86_64-apple-darwin }

    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-jq
            make
            unzip

      - name: Install jq
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download the Rack SDK
        run: |
          curl -fsSL -o Rack-SDK.zip \
            "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-${{ matrix.target }}.zip"
          unzip -q Rack-SDK.zip -d ..

      - name: Build
        run: make -j4 dist CROSS_COMPILE=${{ matrix.cross }}

      - uses: actions/upload-artifact@v4
        with:
          name: MoonTechnologies-${{ matrix.target }}
          path: dist/*.vcvplugin
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.vcvplugin
          body: |
            Install: download the `.vcvplugin` for your platform, drop it in your
            Rack plugins folder, and **restart Rack**.

            Full per-platform instructions, including where that folder is:
            [docs/INSTALL.md](https://github.com/drphilibuster/MoonTechnologies/blob/main/docs/INSTALL.md)

            See [CHANGELOG.md](https://github.com/drphilibuster/MoonTechnologies/blob/main/CHANGELOG.md)
            for what changed.
          generate_release_notes: true
